name: Deploy web config to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "ds5dongle-config-web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web config
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ds5dongle-config-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ds5dongle-config-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build --base=/DS5Dongle/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ds5dongle-config-web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
