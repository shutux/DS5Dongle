name: Check upstream updates

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  check:
    name: Check for upstream changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/awalol/DS5Dongle.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Compare with upstream
        id: compare
        run: |
          LOCAL_BASE=$(git merge-base HEAD upstream/master)
          UPSTREAM_HEAD=$(git rev-parse upstream/master)
          if [ "$LOCAL_BASE" = "$UPSTREAM_HEAD" ]; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            echo "✅ Already up to date with upstream"
          else
            COUNT=$(git rev-list "$LOCAL_BASE..upstream/master" --count)
            echo "status=behind" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "⚠️ Upstream has $COUNT new commit(s)"
            echo ""
            echo "New upstream commits:"
            git log --oneline "$LOCAL_BASE..upstream/master"
          fi

      - name: Create issue if behind
        if: steps.compare.outputs.status == 'behind'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔄 Upstream has ${process.env.COUNT} new commit(s)`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
            });
            if (issues.length > 0) {
              console.log('Issue already exists, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `Upstream (\`awalol/DS5Dongle\`) has **${process.env.COUNT}** new commit(s) since our last rebase.\n\nRun locally:\n\`\`\`bash\ngit fetch upstream\ngit log --oneline $(git merge-base HEAD upstream/master)..upstream/master\n\`\`\`\n\nTo rebase:\n\`\`\`bash\ngit rebase upstream/master\n\`\`\``,
              labels: ['upstream-sync'],
            });
        env:
          COUNT: ${{ steps.compare.outputs.count }}
